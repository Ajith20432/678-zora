# Example reverse proxy. Only the TradingView webhook is exposed publicly; the dashboard has NO login,
# so it is never proxied to the internet. View it on the server with an SSH tunnel:
#   ssh -L 8787:127.0.0.1:8787 your-server   then open http://127.0.0.1:8787 on your computer.
# The webhook carries a secret, but it is still sent in clear text on plain HTTP: enable TLS (listen 443 ssl +
# certificates, e.g. from certbot) before using it with TradingView.
server {
    listen 80;
    server_name zora.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = /webhook/tradingview {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
